name: Build and publish PDFs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build paper and Beamer deck
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: |
            paper.tex
            deck.tex
          texlive_version: '2025'
          os: debian
          latexmk_use_xelatex: true

      - name: Verify exact lengths and text
        run: |
          set -euo pipefail
          test "$(pdfinfo paper.pdf | awk '/^Pages:/ {print $2}')" = 20
          test "$(pdfinfo deck.pdf | awk '/^Pages:/ {print $2}')" = 10
          pdftotext paper.pdf - | grep -q 'Authorized Agent Workflows'
          pdftotext deck.pdf - | grep -q 'Authorized Agent Workflows'
          test "$(grep -c '\\begin{frame}' deck.tex)" = 10

      - name: Stage site
        run: |
          cp paper.pdf docs/paper.pdf
          cp deck.pdf docs/deck.pdf
          printf '%s\n' "${GITHUB_SHA}" > docs/source-commit.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
