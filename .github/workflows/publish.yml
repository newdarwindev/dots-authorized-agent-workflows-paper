name: Build and publish PDFs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate public mock evidence without private checkout
        run: |
          python3 -m venv build/mock-verify
          build/mock-verify/bin/pip install -r scripts/mock-requirements.txt
          build/mock-verify/bin/python -m unittest discover -s scripts/tests -v
          build/mock-verify/bin/python scripts/mock.py verify --summary review/mock-summary.json

      - name: Build paper and Beamer deck
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: |
            paper.tex
            deck.tex
          texlive_version: '2025'
          os: debian
          latexmk_use_xelatex: true

      - name: Verify exact lengths and text
        run: |
          set -euo pipefail
          python3 -m venv .verify-venv
          .verify-venv/bin/python -m pip install --disable-pip-version-check pypdf==5.9.0
          .verify-venv/bin/python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          for filename, expected in (("paper.pdf", 20), ("deck.pdf", 10)):
              pdf = PdfReader(filename)
              print(f"{filename}: {len(pdf.pages)} pages")
              assert len(pdf.pages) == expected, f"{filename} must have {expected} pages"
              assert len(pdf.pages[0].extract_text().strip()) > 40, f"{filename} has no extractable title text"
          assert Path("deck.tex").read_text().count(r"\begin{frame}") == 10
          PY

      - name: Stage site
        run: |
          cp review/mock-summary.json docs/mock-summary.json
          cp paper.pdf docs/paper.pdf
          cp deck.pdf docs/deck.pdf
          printf '%s\n' "${GITHUB_SHA}" > docs/source-commit.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
